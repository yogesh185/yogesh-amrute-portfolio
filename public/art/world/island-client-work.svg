<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560">
  <defs>
    <linearGradient id="cwRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2036"/>
      <stop offset="0.6" stop-color="#1B1528"/>
      <stop offset="1" stop-color="#120E1D"/>
    </linearGradient>
    <linearGradient id="cwTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5A33"/>
      <stop offset="1" stop-color="#4A3520"/>
    </linearGradient>
    <linearGradient id="cwFall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBEFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9BD4F5" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="cwGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <filter id="cwBlur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="cwBlurSm"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      @keyframes smoke { 0% { transform: translateY(0) scale(1); opacity:.65; } 100% { transform: translateY(-70px) scale(1.9); opacity:0; } }
      .sm { animation: smoke 3.2s ease-out infinite; }
      @keyframes fall { 0% { transform: translateY(-30px); opacity:.4; } 50% { opacity:.95; } 100% { transform: translateY(60px); opacity:.2; } }
      .wf { animation: fall 2.4s linear infinite; }
      @keyframes flick { 0%,100% { opacity:.7; } 50% { opacity:1; } }
      .win { animation: flick 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Under-glow -->
  <ellipse cx="350" cy="470" rx="270" ry="60" fill="url(#cwGlow)" filter="url(#cwBlur)"/>

  <!-- Waterfall -->
  <path d="M548 250 C556 330, 542 400, 536 470" stroke="url(#cwFall)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M548 250 C556 330, 542 400, 536 470" stroke="#EBEFFF" stroke-width="6" fill="none" stroke-linecap="round" class="wf" stroke-dasharray="14 26"/>
  <path d="M536 470 q 12 26 -6 44" stroke="#9BD4F5" stroke-width="8" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- Floating rock body -->
  <path d="M 95 232 Q 350 308 605 232 C 642 282, 604 352, 524 402 C 464 448, 402 492, 350 532 C 298 492, 236 448, 176 402 C 96 352, 58 282, 95 232 Z"
        fill="url(#cwRock)"/>
  <g stroke="#0D0A16" stroke-width="5" fill="none" opacity="0.55">
    <path d="M120 300 Q 350 372 580 300"/>
    <path d="M170 372 Q 350 432 530 372"/>
    <path d="M250 452 Q 350 492 452 452"/>
  </g>
  <g stroke="#F5A623" stroke-width="3" fill="none" opacity="0.35">
    <path d="M110 260 Q 200 296 300 316"/>
    <path d="M590 262 Q 520 300 452 320"/>
  </g>

  <!-- Plateau -->
  <ellipse cx="350" cy="230" rx="258" ry="66" fill="url(#cwTop)"/>
  <path d="M 100 224 Q 350 168 600 224" stroke="#F5A623" stroke-width="5" fill="none" opacity="0.55"/>
  <ellipse cx="350" cy="246" rx="238" ry="46" fill="#0D0A16" opacity="0.25"/>

  <!-- FACTORY / WORKSHOP -->
  <g>
    <rect x="200" y="150" width="180" height="86" rx="8" fill="#241C33"/>
    <path d="M196 156 l94 -44 l94 44 Z" fill="#332747"/>
    <path d="M220 148 l30 -20 l0 20 Z M262 148 l30 -20 l0 20 Z M304 148 l30 -20 l0 20 Z" fill="#F5A623" opacity="0.5"/>
    <g fill="#F5A623" class="win">
      <rect x="216" y="172" width="26" height="20" rx="4"/>
      <rect x="252" y="172" width="26" height="20" rx="4" style="animation-delay:-.8s"/>
      <rect x="288" y="172" width="26" height="20" rx="4" style="animation-delay:-1.6s"/>
      <rect x="324" y="172" width="26" height="20" rx="4" style="animation-delay:-.4s"/>
      <rect x="240" y="204" width="30" height="32" rx="4" opacity="0.85"/>
      <rect x="300" y="204" width="30" height="32" rx="4" opacity="0.85"/>
    </g>
    <rect x="344" y="96" width="26" height="66" rx="5" fill="#1A1428"/>
    <rect x="341" y="92" width="32" height="12" rx="4" fill="#332747"/>
    <g fill="#B9C2E8">
      <circle class="sm" cx="357" cy="86" r="12" opacity="0.65" style="animation-delay:-1.1s"/>
      <circle class="sm" cx="357" cy="86" r="9"  opacity="0.65" style="animation-delay:-2.2s"/>
      <circle class="sm" cx="357" cy="86" r="14" opacity="0.65"/>
    </g>
    <!-- Crane -->
    <g stroke="#57402A" stroke-width="8" fill="none" stroke-linecap="round">
      <path d="M470 236 L470 120"/>
      <path d="M470 124 L566 150"/>
      <path d="M470 124 L436 148"/>
    </g>
    <path d="M540 150 l0 34" stroke="#57402A" stroke-width="4"/>
    <rect x="526" y="184" width="30" height="22" rx="4" fill="#F5A623" opacity="0.9"/>
    <!-- Conveyor -->
    <rect x="396" y="214" width="96" height="14" rx="7" fill="#1A1428"/>
    <g fill="#F5A623" opacity="0.9">
      <circle cx="410" cy="221" r="5"/><circle cx="440" cy="221" r="5"/><circle cx="470" cy="221" r="5"/>
    </g>
    <!-- Crates -->
    <rect x="140" y="206" width="34" height="30" rx="4" fill="#332747"/>
    <rect x="146" y="196" width="24" height="14" rx="3" fill="#57402A"/>
    <!-- Tree -->
    <g>
      <rect x="574" y="212" width="7" height="24" rx="3" fill="#3B2A1E"/>
      <circle cx="577" cy="200" r="20" fill="#A3D977" opacity="0.75"/>
      <circle cx="566" cy="208" r="13" fill="#86C25B" opacity="0.7"/>
    </g>
  </g>

  <!-- Hanging vines -->
  <g stroke="#A3D977" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M160 288 q 4 34 -2 56"/>
    <path d="M472 316 q -3 30 2 48"/>
  </g>

  <!-- Orbiting debris -->
  <circle cx="622" cy="360" r="11" fill="#241C33"/>
  <circle cx="640" cy="330" r="6" fill="#332747"/>
  <circle cx="86" cy="396" r="9" fill="#1B1528"/>

  <!-- Accent beacon -->
  <circle cx="357" cy="70" r="7" fill="#F5A623" class="win"/>
  <circle cx="357" cy="70" r="14" fill="#F5A623" opacity="0.3" filter="url(#cwBlurSm)" class="win"/>
</svg>
