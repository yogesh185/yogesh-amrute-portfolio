<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="stWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121A30"/>
      <stop offset="1" stop-color="#0B1122"/>
    </linearGradient>
    <linearGradient id="stFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#06090F"/>
    </linearGradient>
    <radialGradient id="stAmbient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8157F6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8157F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1130"/>
      <stop offset="0.7" stop-color="#241A5C"/>
      <stop offset="1" stop-color="#5B3084"/>
    </linearGradient>
    <linearGradient id="stLamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes rain { 0% { transform: translateY(-60px); } 100% { transform: translateY(120px); } }
      .drop { animation: rain 1.1s linear infinite; }
      .drop2 { animation-duration: 1.6s; animation-delay: -.5s; }
      .drop3 { animation-duration: .9s; animation-delay: -.2s; }
      @keyframes tw { 0%,100% { opacity:.3; } 50% { opacity:.95; } }
      .stw { animation: tw 3s ease-in-out infinite; }
      @keyframes steam { 0% { transform: translateY(0); opacity:.7; } 100% { transform: translateY(-26px); opacity:0; } }
      .stm { animation: steam 2.4s ease-out infinite; }
      .stm2 { animation-delay: -1.2s; }
      @keyframes caret { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
      .caret { animation: caret 1s step-end infinite; }
    </style>
  </defs>

