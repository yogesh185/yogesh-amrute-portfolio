<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="100%" stopColor="#080D1B" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#315CFF" />
      <stop offset="100%" stopColor="#79A7FF" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#111B33" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#162442" stopOpacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" rx="28" fill="url(#bgGrad)" stroke="rgba(121, 167, 255, 0.2)" stroke-width="2" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="950" cy="200" r="280" fill="#315CFF" opacity="0.18" filter="url(#glow)" />
  <circle cx="200" cy="600" r="240" fill="#79A7FF" opacity="0.12" filter="url(#glow)" />

  <!-- App Header -->
  <rect x="0" y="0" width="1200" height="64" fill="#0D162C" opacity="0.9" />
  <line x1="0" y1="64" x2="1200" y2="64" stroke="rgba(121, 167, 255, 0.15)" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="36" cy="32" r="6" fill="#FF5F56" />
  <circle cx="56" cy="32" r="6" fill="#FFBD2E" />
  <circle cx="76" cy="32" r="6" fill="#27C93F" />
  
  <text x="110" y="38" fill="#F5F4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" letter-spacing="0.05em">DOC AI</text>
  <rect x="180" y="22" width="130" height="22" rx="11" fill="rgba(49, 92, 255, 0.2)" stroke="rgba(121, 167, 255, 0.4)" />
  <text x="192" y="37" fill="#79A7FF" font-family="monospace" font-size="11" font-weight="600">RAG ENGINE v2.4</text>
  
  <!-- Active Document Indicator -->
  <text x="600" y="37" text-anchor="middle" fill="#AAB4C8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">architecture_whitepaper_2024.pdf</text>

  <!-- Left Sidebar: Document Ingestion & Chunks -->
  <rect x="30" y="90" width="280" height="625" rx="16" fill="url(#cardBg)" stroke="rgba(121, 167, 255, 0.15)" stroke-width="1" />
  <text x="50" y="125" fill="#AAB4C8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.1em">INGESTED SOURCES (4)</text>
  
  <!-- Doc Item 1 (Active) -->
  <rect x="45" y="145" width="250" height="70" rx="12" fill="#1C2C54" stroke="#315CFF" stroke-width="1.5" />
  <rect x="58" y="160" width="24" height="30" rx="4" fill="#315CFF" opacity="0.3" stroke="#79A7FF" />
  <text x="92" y="174" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-weight="600" font-size="13">architecture_whitepaper</text>
  <text x="92" y="194" fill="#AAB4C8" font-family="monospace" font-size="10">84 CHUNKS · VECTORIZED</text>
  
  <!-- Doc Item 2 -->
  <rect x="45" y="225" width="250" height="60" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(121, 167, 255, 0.1)" />
  <text x="92" y="250" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-weight="500" font-size="12">system_requirements.md</text>
  <text x="92" y="268" fill="#64748B" font-family="monospace" font-size="10">32 CHUNKS · INDEXED</text>
  
  <!-- Doc Item 3 -->
  <rect x="45" y="295" width="250" height="60" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(121, 167, 255, 0.1)" />
  <text x="92" y="320" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-weight="500" font-size="12">api_contract_v3.json</text>
  <text x="92" y="338" fill="#64748B" font-family="monospace" font-size="10">18 CHUNKS · INDEXED</text>
  
  <!-- Vector Search Stats Box -->
  <rect x="45" y="580" width="250" height="115" rx="12" fill="rgba(49, 92, 255, 0.08)" stroke="rgba(121, 167, 255, 0.2)" />
  <text x="60" y="605" fill="#79A7FF" font-family="monospace" font-size="11" font-weight="700">RETRIEVAL METRICS</text>
  <text x="60" y="630" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-size="12">Similarity Metric: <tspan fill="#B7FF4A" font-weight="600">Cosine</tspan></text>
  <text x="60" y="652" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-size="12">Chunk Overlap: <tspan fill="#AAB4C8">64 tokens</tspan></text>
  <text x="60" y="674" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-size="12">Citation Verification: <tspan fill="#B7FF4A">Strict</tspan></text>

  <!-- Center Pane: Source PDF Document Viewer with Highlight -->
  <rect x="330" y="90" width="450" height="625" rx="16" fill="url(#cardBg)" stroke="rgba(121, 167, 255, 0.15)" stroke-width="1" />
  <text x="355" y="125" fill="#AAB4C8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.1em">DOCUMENT VIEWER // PAGE 14</text>
  
  <!-- Document Mock Page -->
  <rect x="355" y="145" width="400" height="545" rx="10" fill="#0A0F1D" stroke="rgba(121, 167, 255, 0.1)" />
  
  <text x="380" y="185" fill="#F5F4F0" font-family="serif" font-size="18" font-weight="700">Section 4.2: Real-Time Vector Retrieval Pipeline</text>
  
  <rect x="380" y="205" width="350" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)" />
  <rect x="380" y="222" width="320" height="8" rx="4" fill="rgba(255, 255, 255, 0.15)" />
  
  <!-- Highlighted Retrieved Chunk in Doc -->
  <rect x="375" y="245" width="360" height="110" rx="8" fill="rgba(49, 92, 255, 0.25)" stroke="#315CFF" stroke-width="1.5" stroke-dasharray="4 2" />
  <text x="390" y="272" fill="#B7FF4A" font-family="monospace" font-size="10" font-weight="700">[RETRIEVED CHUNK #42 · SCORE 0.94]</text>
  <text x="390" y="295" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-size="13">"The hybrid retrieval layer combines dense vector embeddings</text>
  <text x="390" y="317" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-size="13">with exact BM25 keyword matching to eliminate hallucinations</text>
  <text x="390" y="339" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-size="13">and ensure deterministic source anchor citations."</text>
  
  <rect x="380" y="375" width="350" height="8" rx="4" fill="rgba(255, 255, 255, 0.15)" />
  <rect x="380" y="392" width="290" height="8" rx="4" fill="rgba(255, 255, 255, 0.15)" />
  <rect x="380" y="409" width="330" height="8" rx="4" fill="rgba(255, 255, 255, 0.15)" />

  <!-- Right Pane: Conversational Citation Assistant -->
  <rect x="800" y="90" width="370" height="625" rx="16" fill="url(#cardBg)" stroke="rgba(121, 167, 255, 0.15)" stroke-width="1" />
  <text x="825" y="125" fill="#AAB4C8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.1em">AI CONVERSATION &amp; CITATIONS</text>

  <!-- User Query Bubble -->
  <rect x="825" y="150" width="320" height="64" rx="14" fill="#1E2942" stroke="rgba(121, 167, 255, 0.2)" />
  <text x="840" y="174" fill="#AAB4C8" font-family="-apple-system, sans-serif" font-size="11">USER PROMPT</text>
  <text x="840" y="196" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-weight="500" font-size="13">How does the retrieval layer eliminate hallucinations?</text>

  <!-- Assistant Response Bubble -->
  <rect x="825" y="230" width="320" height="280" rx="14" fill="rgba(49, 92, 255, 0.15)" stroke="#315CFF" stroke-width="1.5" />
  <rect x="840" y="248" width="80" height="20" rx="10" fill="#315CFF" />
  <text x="852" y="262" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">DOC AI</text>
  
  <text x="840" y="295" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="400">The architecture eliminates hallucinations</text>
  <text x="840" y="318" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="400">through hybrid retrieval: pairing dense vector</text>
  <text x="840" y="341" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="400">search with BM25 keyword matching,</text>
  <text x="840" y="364" fill="#F5F4F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="400">enforcing verbatim citation constraints.</text>

  <!-- Citation Anchor Pill -->
  <rect x="840" y="390" width="290" height="36" rx="8" fill="#0A0F1D" stroke="#79A7FF" stroke-width="1" />
  <circle cx="855" cy="408" r="4" fill="#B7FF4A" />
  <text x="868" y="412" fill="#79A7FF" font-family="monospace" font-size="11" font-weight="600">Source: Page 14 · §4.2 Architecture</text>
  
  <!-- Second citation -->
  <rect x="840" y="435" width="290" height="36" rx="8" fill="#0A0F1D" stroke="rgba(121, 167, 255, 0.3)" stroke-width="1" />
  <circle cx="855" cy="453" r="4" fill="#79A7FF" />
  <text x="868" y="457" fill="#AAB4C8" font-family="monospace" font-size="11">Source: Page 16 · Vector Benchmarks</text>

  <!-- Input Field Mock -->
  <rect x="825" y="640" width="320" height="50" rx="25" fill="#0A0F1D" stroke="rgba(121, 167, 255, 0.3)" />
  <text x="845" y="670" fill="#64748B" font-family="-apple-system, sans-serif" font-size="13">Ask anything about this document...</text>
  <circle cx="915" cy="665" r="14" fill="#315CFF" />
  <path d="M 911,665 L 919,665 M 915,661 L 919,665 L 915,669" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
