<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 620" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="farRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3F78"/>
      <stop offset="1" stop-color="#2A2C5E"/>
    </linearGradient>
    <linearGradient id="midRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262A57"/>
      <stop offset="1" stop-color="#171A3C"/>
    </linearGradient>
    <linearGradient id="nearRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151834"/>
      <stop offset="1" stop-color="#0C0E22"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFC97A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Farthest ridge — hazed out -->
  <path d="M0 620 L0 330 L150 260 L320 340 L470 220 L640 320 L780 250 L960 350 L1120 240 L1300 330 L1470 210 L1660 320 L1820 250 L2010 340 L2180 240 L2400 320 L2400 620 Z"
        fill="url(#farRidge)" opacity="0.55"/>
  <!-- Warm rim on far ridge (sunset side) -->
  <path d="M470 220 L640 320 M1120 240 L1300 330 M1470 210 L1660 320 M2180 240 L2400 320"
        stroke="url(#rimLight)" stroke-width="5" fill="none" opacity="0.8"/>

  <!-- Mid ridge -->
  <path d="M0 620 L0 430 L180 360 L360 440 L540 350 L720 450 L900 370 L1080 460 L1260 360 L1450 450 L1640 370 L1830 460 L2020 380 L2220 450 L2400 400 L2400 620 Z"
        fill="url(#midRidge)" opacity="0.85"/>

  <!-- Near ridge — darkest -->
  <path d="M0 620 L0 530 L200 470 L420 540 L640 470 L860 550 L1080 480 L1320 560 L1560 480 L1800 555 L2040 485 L2260 550 L2400 510 L2400 620 Z"
        fill="url(#nearRidge)"/>

  <!-- Snow / light caps on mid ridge peaks -->
  <g fill="#8B93AC" opacity="0.35">
    <path d="M540 350 l26 20 l-26 8 l-24 -10 Z"/>
    <path d="M1260 360 l28 22 l-28 8 l-26 -10 Z"/>
    <path d="M2020 380 l26 20 l-26 8 l-24 -10 Z"/>
  </g>
</svg>
