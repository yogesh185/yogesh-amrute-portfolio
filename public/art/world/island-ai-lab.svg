<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560">
  <defs>
    <linearGradient id="aiRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2740"/>
      <stop offset="0.6" stop-color="#121B30"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="aiTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D6E96"/>
      <stop offset="1" stop-color="#254866"/>
    </linearGradient>
    <linearGradient id="aiFall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DE8FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="vat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8157F6" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="aiGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dome" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#EBEFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8157F6" stop-opacity="0.32"/>
    </radialGradient>
    <filter id="aiBlur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="aiBlurSm"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      @keyframes fall { 0% { transform: translateY(-30px); opacity:.4; } 50% { opacity:.95; } 100% { transform: translateY(60px); opacity:.2; } }
      .wf { animation: fall 2.4s linear infinite; }
      @keyframes bubble { 0% { transform: translateY(0); opacity:.9; } 100% { transform: translateY(-46px); opacity:0; } }
      .bub { animation: bubble 2.8s ease-in infinite; }
      .bub2 { animation-delay: -1.4s; }
      .bub3 { animation-delay: -2.1s; }
      @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }
      .beacon { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes glowline { 0%,100% { opacity:.4; } 50% { opacity:1; } }
      .line { animation: glowline 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Under-glow -->
  <ellipse cx="350" cy="470" rx="270" ry="60" fill="url(#aiGlow)" filter="url(#aiBlur)"/>

  <!-- Energy waterfall -->
  <path d="M162 254 C154 328, 166 402, 172 472" stroke="url(#aiFall)" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M162 254 C154 328, 166 402, 172 472" stroke="#EBEFFF" stroke-width="5" fill="none" stroke-linecap="round" class="wf" stroke-dasharray="10 22"/>
  <circle cx="172" cy="482" r="10" fill="#38BDF8" opacity="0.5" filter="url(#aiBlurSm)"/>

  <!-- Rock -->
  <path d="M 95 232 Q 350 308 605 232 C 642 282, 604 352, 524 402 C 464 448, 402 492, 350 532 C 298 492, 236 448, 176 402 C 96 352, 58 282, 95 232 Z"
        fill="url(#aiRock)"/>
  <g stroke="#070C17" stroke-width="5" fill="none" opacity="0.55">
    <path d="M120 300 Q 350 372 580 300"/>
    <path d="M170 372 Q 350 432 530 372"/>
    <path d="M250 452 Q 350 492 452 452"/>
  </g>
  <g stroke="#38BDF8" stroke-width="3" fill="none" opacity="0.5" class="line">
    <path d="M140 320 l50 0 l24 24 l60 0"/>
    <path d="M560 316 l-54 0 l-26 26 l-64 0"/>
    <circle cx="140" cy="320" r="5" fill="#38BDF8"/>
    <circle cx="560" cy="316" r="5" fill="#38BDF8"/>
  </g>

  <!-- Plateau -->
  <ellipse cx="350" cy="230" rx="258" ry="66" fill="url(#aiTop)"/>
  <path d="M 100 224 Q 350 168 600 224" stroke="#7DE8FF" stroke-width="5" fill="none" opacity="0.55"/>
  <ellipse cx="350" cy="246" rx="238" ry="46" fill="#070C17" opacity="0.25"/>

  <!-- GLASS DOME LAB -->
  <g>
    <circle cx="350" cy="164" r="86" fill="url(#dome)" stroke="#7DE8FF" stroke-width="4" opacity="0.95"/>
    <g stroke="#7DE8FF" stroke-width="3" fill="none" opacity="0.6">
      <path d="M264 164 h172"/>
      <path d="M350 78 v172"/>
      <ellipse cx="350" cy="164" rx="86" ry="34"/>
    </g>
    <circle cx="350" cy="156" r="26" fill="#8157F6" opacity="0.9" class="line"/>
    <circle cx="350" cy="156" r="40" fill="#8157F6" opacity="0.4" filter="url(#aiBlurSm)" class="line"/>
    <circle cx="350" cy="156" r="12" fill="#EBEFFF" class="line"/>
    <rect x="256" y="234" width="188" height="16" rx="8" fill="#1A2740"/>
  </g>

  <!-- GLASS VATS with bubbles -->
  <g>
    <rect x="470" y="168" width="52" height="70" rx="12" fill="#0B1120" stroke="#38BDF8" stroke-width="3"/>
    <rect x="474" y="188" width="44" height="46" rx="9" fill="url(#vat)" opacity="0.8"/>
    <circle cx="488" cy="222" r="5" fill="#EBEFFF" class="bub"/>
    <circle cx="502" cy="226" r="4" fill="#EBEFFF" class="bub bub2"/>
    <circle cx="494" cy="230" r="3.5" fill="#EBEFFF" class="bub bub3"/>
    <rect x="536" y="188" width="44" height="50" rx="10" fill="#0B1120" stroke="#38BDF8" stroke-width="3"/>
    <rect x="540" y="204" width="36" height="30" rx="7" fill="url(#vat)" opacity="0.75"/>
    <circle cx="552" cy="226" r="4" fill="#EBEFFF" class="bub bub2"/>
    <circle cx="564" cy="230" r="3" fill="#EBEFFF" class="bub bub3"/>
  </g>

  <!-- ANTENNA / TRANSMITTER -->
  <g>
    <rect x="176" y="130" width="12" height="112" rx="6" fill="#254866"/>
    <path d="M182 130 l-30 34 M182 130 l30 34" stroke="#254866" stroke-width="6" stroke-linecap="round"/>
    <circle cx="182" cy="120" r="8" fill="#38BDF8" class="beacon"/>
    <circle cx="182" cy="120" r="20" fill="#38BDF8" opacity="0.35" filter="url(#aiBlurSm)" class="beacon"/>
    <g stroke="#38BDF8" fill="none" stroke-width="3" opacity="0.6">
      <path d="M198 100 a 22 22 0 0 1 0 40" class="line"/>
      <path d="M208 90 a 34 34 0 0 1 0 60" class="line" style="animation-delay:-1s"/>
    </g>
  </g>

  <!-- Pipes -->
  <g stroke="#1A2740" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M264 240 q 30 26 86 26"/>
    <path d="M444 240 q -20 24 -60 26"/>
  </g>
  <g stroke="#38BDF8" stroke-width="3" fill="none" opacity="0.6" class="line">
    <path d="M270 242 q 30 22 80 22"/>
    <path d="M440 242 q -18 20 -54 22"/>
  </g>

  <!-- Floating debris -->
  <rect x="624" y="330" width="18" height="18" rx="4" fill="#121B30" transform="rotate(18 632 339)"/>
  <circle cx="82" cy="386" r="10" fill="#1A2740"/>
</svg>
