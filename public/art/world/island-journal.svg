<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560">
  <defs>
    <linearGradient id="jnRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2745"/>
      <stop offset="0.6" stop-color="#141B33"/>
      <stop offset="1" stop-color="#0C1122"/>
    </linearGradient>
    <linearGradient id="jnTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45689E"/>
      <stop offset="1" stop-color="#2C4670"/>
    </linearGradient>
    <linearGradient id="jnFall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBEFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9BD4F5" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="jnGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/>
    </linearGradient>
    <filter id="jnBlur"><feGaussianBlur stdDeviation="14"/></filter>
    <style>
      @keyframes fall { 0% { transform: translateY(-30px); opacity:.4; } 50% { opacity:.95; } 100% { transform: translateY(60px); opacity:.2; } }
      .wf { animation: fall 2.7s linear infinite; }
      @keyframes beaconSweep { 0%,100% { transform: rotate(-24deg); } 50% { transform: rotate(24deg); } }
      .lbeam { transform-origin: 402px 128px; animation: beaconSweep 5s ease-in-out infinite; }
      @keyframes flick { 0%,100% { opacity:.65; } 50% { opacity:1; } }
      .lit { animation: flick 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Under-glow -->
  <ellipse cx="350" cy="470" rx="270" ry="60" fill="url(#jnGlow)" filter="url(#jnBlur)"/>

  <!-- Waterfall -->
  <path d="M544 252 C552 326, 540 400, 534 470" stroke="url(#jnFall)" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M544 252 C552 326, 540 400, 534 470" stroke="#EBEFFF" stroke-width="5" fill="none" stroke-linecap="round" class="wf" stroke-dasharray="12 24"/>

  <!-- Rock -->
  <path d="M 95 232 Q 350 308 605 232 C 642 282, 604 352, 524 402 C 464 448, 402 492, 350 532 C 298 492, 236 448, 176 402 C 96 352, 58 282, 95 232 Z"
        fill="url(#jnRock)"/>
  <g stroke="#080C19" stroke-width="5" fill="none" opacity="0.55">
    <path d="M120 300 Q 350 372 580 300"/>
    <path d="M170 372 Q 350 432 530 372"/>
    <path d="M250 452 Q 350 492 452 452"/>
  </g>
  <g stroke="#60A5FA" stroke-width="3" fill="none" opacity="0.35">
    <path d="M110 262 Q 200 298 300 318"/>
    <path d="M590 262 Q 520 300 452 320"/>
  </g>

  <!-- Plateau -->
  <ellipse cx="350" cy="230" rx="258" ry="66" fill="url(#jnTop)"/>
  <path d="M 100 224 Q 350 168 600 224" stroke="#9CC8FF" stroke-width="5" fill="none" opacity="0.55"/>
  <ellipse cx="350" cy="246" rx="238" ry="46" fill="#080C19" opacity="0.25"/>

  <!-- LIGHTHOUSE -->
  <g>
    <!-- Sweeping beam (behind lantern) -->
    <g class="lbeam">
      <polygon points="402,128 660,54 660,202" fill="url(#beamG)" opacity="0.5"/>
    </g>
    <!-- Tower -->
    <path d="M378 240 L388 140 L416 140 L426 240 Z" fill="#EBEFFF" opacity="0.92"/>
    <path d="M378 240 L388 140 L402 140 L396 240 Z" fill="#C9D4F0"/>
    <g stroke="#EF4444" stroke-width="7" opacity="0.85">
      <path d="M382 216 h40"/>
      <path d="M385 192 h34"/>
      <path d="M388 168 h28"/>
    </g>
    <!-- Lantern room -->
    <rect x="384" y="112" width="36" height="30" rx="6" fill="#1C2745"/>
    <rect x="390" y="118" width="24" height="18" rx="4" fill="#FFF3C4" class="lit"/>
    <path d="M378 112 l24 -26 l24 26 Z" fill="#EF4444"/>
    <circle cx="402" cy="92" r="6" fill="#FFF3C4" class="lit"/>
    <path d="M372 142 h60" stroke="#1C2745" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- BOOK STACK -->
  <g>
    <rect x="150" y="212" width="96" height="22" rx="5" fill="#8157F6"/>
    <rect x="158" y="192" width="86" height="22" rx="5" fill="#EC4899"/>
    <rect x="152" y="172" width="92" height="22" rx="5" fill="#38BDF8"/>
    <rect x="166" y="154" width="72" height="20" rx="5" fill="#A3D977"/>
    <g stroke="#0C1122" stroke-width="3" opacity="0.5">
      <path d="M170 218 h60"/><path d="M176 198 h52"/><path d="M170 178 h56"/>
    </g>
    <!-- Bookmark -->
    <path d="M232 154 l0 30 l8 -8 l8 8 l0 -30 Z" fill="#F5A623"/>
  </g>

  <!-- OPEN BOOK on stand -->
  <g>
    <path d="M470 218 q 30 -18 60 0 l0 20 q -30 -16 -60 0 Z" fill="#EBEFFF" opacity="0.95"/>
    <path d="M500 214 l0 26" stroke="#1C2745" stroke-width="3"/>
    <path d="M482 220 h14 M506 220 h14" stroke="#8B93AC" stroke-width="3"/>
    <path d="M500 244 l-8 0 l0 -8 M500 244 l8 0 l0 -8" stroke="#45689E" stroke-width="4" fill="none"/>
  </g>

  <!-- Path stones -->
  <g fill="#2C4670">
    <ellipse cx="330" cy="242" rx="16" ry="7"/>
    <ellipse cx="360" cy="248" rx="14" ry="6"/>
    <ellipse cx="390" cy="242" rx="16" ry="7"/>
  </g>

  <!-- Debris -->
  <circle cx="624" cy="352" r="11" fill="#141B33"/>
  <circle cx="86" cy="392" r="9" fill="#1C2745"/>
</svg>
